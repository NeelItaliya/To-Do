<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your tasks | To-Do</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <script>
    try {
      if (!localStorage.getItem('token')) window.location.replace('/login');
    } catch {
      window.location.replace('/login');
    }
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="toolbar glass">
    <a class="brand" href="/" aria-label="To-Do home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="11.5" opacity=".25"/>
        <path d="M16 4.5a11.5 11.5 0 1 1-11.5 11.5"/>
        <path d="M11 16.5l3.4 3.4 6.8-7.4"/>
      </svg>
      <span class="brand-name">To-Do</span>
    </a>

    <label class="search">
      <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#search"/></svg>
      <span class="visually-hidden">Search tasks by title</span>
      <input id="search" type="search" placeholder="Search tasks" autocomplete="off" spellcheck="false">
      <kbd class="search-key" aria-hidden="true">/</kbd>
    </label>

    <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
      <svg class="icon icon-moon" aria-hidden="true"><use href="/img/icons.svg#moon"/></svg>
      <svg class="icon icon-sun" aria-hidden="true"><use href="/img/icons.svg#sun"/></svg>
    </button>
    <button class="avatar" type="button" id="account-btn" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu" aria-label="Account">
      <span id="avatar-initial"></span>
    </button>
  </header>

  <div class="menu glass" id="account-menu" hidden>
    <p class="menu-user">Signed in as <strong id="menu-username"></strong></p>
    <button class="menu-item" type="button" id="sign-out">
      <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#sign-out"/></svg>
      Sign out
    </button>
  </div>

  <div class="shell">
    <nav class="rail glass" aria-label="Filter tasks">
      <div class="filters" id="filters">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#list"/></svg>
          <span class="filter-label">All</span>
          <span class="filter-count" data-count="all">0</span>
        </button>
        <button class="filter" type="button" data-filter="open" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#circle"/></svg>
          <span class="filter-label">Open</span>
          <span class="filter-count" data-count="open">0</span>
        </button>
        <button class="filter" type="button" data-filter="soon" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#clock"/></svg>
          <span class="filter-label">Due soon</span>
          <span class="filter-count" data-count="soon">0</span>
        </button>
        <button class="filter" type="button" data-filter="missed" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#alert"/></svg>
          <span class="filter-label">Missed</span>
          <span class="filter-count" data-count="missed">0</span>
        </button>
        <button class="filter" type="button" data-filter="done" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#check-circle"/></svg>
          <span class="filter-label">Done</span>
          <span class="filter-count" data-count="done">0</span>
        </button>
      </div>
    </nav>

    <main class="board">
      <header class="board-head">
        <h1 id="today"></h1>
        <p id="summary" aria-live="polite"></p>
      </header>

      <form class="composer glass" id="composer" novalidate>
        <div class="composer-row">
          <svg class="icon composer-plus" aria-hidden="true"><use href="/img/icons.svg#plus"/></svg>
          <input id="new-title" type="text" placeholder="Add a task" aria-label="New task title" autocomplete="off" maxlength="200" enterkeyhint="next">
        </div>
        <div class="composer-more" id="composer-more" inert>
          <div class="composer-more-inner">
            <div class="composer-group">
              <span class="group-label" id="due-label">Due</span>
              <div class="chips" id="due-chips" role="group" aria-labelledby="due-label"></div>
              <input class="input input-sm" id="new-deadline" type="datetime-local" aria-label="Deadline date and time">
            </div>
            <div class="composer-group">
              <span class="group-label" id="priority-label">Priority</span>
              <div class="seg" role="radiogroup" aria-labelledby="priority-label">
                <label><input type="radio" name="new-priority" value="low"><span>Low</span></label>
                <label><input type="radio" name="new-priority" value="medium" checked><span>Medium</span></label>
                <label><input type="radio" name="new-priority" value="high"><span>High</span></label>
              </div>
              <button class="btn btn-primary btn-sm composer-submit" type="submit">Add task</button>
            </div>
            <p class="form-error" id="composer-error" role="alert" hidden></p>
          </div>
        </div>
      </form>

      <div class="list-head">
        <h2 id="list-title">All tasks</h2>
        <div class="list-tools">
          <button class="btn btn-quiet btn-sm" type="button" id="complete-all" hidden>Mark all done</button>
          <label class="sort">
            <span>Sort</span>
            <select id="sort">
              <option value="deadline">Deadline</option>
              <option value="priority">Priority</option>
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title">Title</option>
            </select>
          </label>
        </div>
      </div>

      <section class="list glass" aria-labelledby="list-title">
        <ul class="tasks" id="tasks"></ul>
        <div class="empty" id="empty">
          <p class="empty-title" id="empty-title">Loading your tasks…</p>
          <p class="empty-body" id="empty-body"></p>
          <button class="btn btn-soft btn-sm" type="button" id="retry" hidden>Try again</button>
        </div>
      </section>
    </main>
  </div>

  <dialog class="sheet" id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" class="sheet-body" novalidate>
      <h2 id="edit-heading">Edit task</h2>
      <label class="field">
        <span class="field-label">Title</span>
        <input class="input" id="edit-title" type="text" maxlength="200" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Deadline</span>
        <input class="input" id="edit-deadline" type="datetime-local">
      </label>
      <div class="field">
        <span class="field-label" id="edit-priority-label">Priority</span>
        <div class="seg" role="radiogroup" aria-labelledby="edit-priority-label">
          <label><input type="radio" name="edit-priority" value="low"><span>Low</span></label>
          <label><input type="radio" name="edit-priority" value="medium"><span>Medium</span></label>
          <label><input type="radio" name="edit-priority" value="high"><span>High</span></label>
        </div>
      </div>
      <p class="form-error" id="edit-error" role="alert" hidden></p>
      <div class="sheet-actions">
        <button class="btn btn-quiet btn-danger" type="button" id="edit-delete">Delete task</button>
        <span class="sheet-spacer"></span>
        <button class="btn btn-soft" type="button" id="edit-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="edit-save">Save changes</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet sheet-confirm" id="confirm-dialog" aria-labelledby="confirm-heading" aria-describedby="confirm-message">
    <div class="sheet-body">
      <h2 id="confirm-heading"></h2>
      <p id="confirm-message"></p>
      <div class="sheet-actions">
        <span class="sheet-spacer"></span>
        <button class="btn btn-soft" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn btn-primary" type="button" id="confirm-ok"></button>
      </div>
    </div>
  </dialog>

  <div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/js/tasks.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
