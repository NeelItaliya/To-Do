<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in to To-Do</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <script>
    try {
      if (localStorage.getItem('token')) window.location.replace('/app');
    } catch {
      // Storage is unavailable; stay on this page.
    }
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <header class="auth-bar">
    <a class="brand" href="/" aria-label="To-Do home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="11.5" opacity=".25"/>
        <path d="M16 4.5a11.5 11.5 0 1 1-11.5 11.5"/>
        <path d="M11 16.5l3.4 3.4 6.8-7.4"/>
      </svg>
      To-Do
    </a>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
      <svg class="icon icon-moon" aria-hidden="true"><use href="/img/icons.svg#moon"/></svg>
      <svg class="icon icon-sun" aria-hidden="true"><use href="/img/icons.svg#sun"/></svg>
    </button>
  </header>

  <main class="auth-main">
    <div class="auth-card glass">
      <h1 id="auth-title">Sign in</h1>
      <p class="auth-sub" id="auth-sub">Your tasks are where you left them.</p>

      <div class="seg auth-seg" role="radiogroup" aria-label="Sign in or create an account">
        <label><input type="radio" name="mode" value="login" checked><span>Sign in</span></label>
        <label><input type="radio" name="mode" value="register"><span>Create account</span></label>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="field">
          <span class="field-label">Username</span>
          <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" required>
        </label>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-hint" required>
            <button class="btn btn-quiet password-toggle" type="button" id="password-toggle" aria-pressed="false" aria-controls="password">Show</button>
          </div>
          <p class="field-hint" id="password-hint" hidden>Use at least 6 characters.</p>
        </div>

        <p class="form-error" id="auth-error" role="alert" hidden></p>

        <button class="btn btn-primary auth-submit" type="submit" id="auth-submit">Sign in</button>
      </form>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
